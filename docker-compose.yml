services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    entrypoint: ["/bin/sh", "/bootstrap/start.sh"]
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq:/bootstrap:ro

  kong:
    image: kong:3.7
    entrypoint: ["/bin/sh", "/kong/template/start.sh"]
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_NGINX_WORKER_PROCESSES: "1"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/kong/template:ro
    depends_on:
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started

  users-api:
    build:
      context: ../FCG-UsersAPI
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Sqlite
      ConnectionStrings__UsersDatabase: ${USERS_DATABASE:?USERS_DATABASE is required}
      Jwt__Issuer: FiapCloudGames.UsersApi
      Jwt__Audience: FiapCloudGames
      Jwt__SecretKey: ${JWT_SECRET:?JWT_SECRET is required}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - users-data:/data

  catalog-api:
    build:
      context: ../FCG-CatalogAPI
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Sqlite
      ConnectionStrings__CatalogDatabase: ${CATALOG_DATABASE:?CATALOG_DATABASE is required}
      ConnectionStrings__MongoDb: ${MONGODB_CONNECTION:?MONGODB_CONNECTION is required}
      ConnectionStrings__Redis: ${REDIS_CONNECTION:?REDIS_CONNECTION is required}
      MongoDb__Database: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      Elasticsearch__Uri: ${ELASTICSEARCH_URI:?ELASTICSEARCH_URI is required}
      Elasticsearch__Username: ${ELASTICSEARCH_USERNAME:?ELASTICSEARCH_USERNAME is required}
      Elasticsearch__Password: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      Elasticsearch__IndexName: ${ELASTICSEARCH_INDEX:?ELASTICSEARCH_INDEX is required}
      Jwt__Issuer: FiapCloudGames.UsersApi
      Jwt__Audience: FiapCloudGames
      Jwt__SecretKey: ${JWT_SECRET:?JWT_SECRET is required}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      UsersApi__BaseUrl: http://users-api:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      users-api:
        condition: service_started
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      opensearch:
        condition: service_healthy
    volumes:
      - catalog-data:/data

  payments-api:
    build:
      context: ../FCG-PaymentsAPI
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      PaymentSimulation__ForcedStatus: Approved
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    volumes:
      - azurite-data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  loki:
    image: grafana/loki:3.2.0
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

volumes:
  loki-data:
  rabbitmq-data:
  users-data:
  catalog-data:
  mongodb-data:
  grafana-data:
  azurite-data:
  opensearch-data:
