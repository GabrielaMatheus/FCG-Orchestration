services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    entrypoint: ["/bin/sh", "/bootstrap/start.sh"]
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq:/bootstrap:ro

  kong:
    image: kong:3.7
    entrypoint: ["/bin/sh", "/kong/template/start.sh"]
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_NGINX_WORKER_PROCESSES: "1"
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-key-change-me-123456789}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/kong/template:ro
    depends_on:
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started

  users-api:
    build:
      context: ../FCG-UsersAPI
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UsersDatabase: Data Source=/data/users.db
      Jwt__Issuer: FiapCloudGames.UsersApi
      Jwt__Audience: FiapCloudGames
      Jwt__SecretKey: ${JWT_SECRET:-development-only-secret-key-change-me-123456789}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fiap.com.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123!}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - users-data:/data

  catalog-api:
    build:
      context: ../FCG-CatalogAPI
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDatabase: ${CATALOG_DATABASE:-Data Source=/data/catalog.db}
      ConnectionStrings__MongoDb: ${MONGODB_CONNECTION:-mongodb://mongodb:27017}
      ConnectionStrings__Redis: ${REDIS_CONNECTION:-redis:6379}
      MongoDb__Database: ${MONGODB_DATABASE:-fcg_catalog}
      Jwt__Issuer: FiapCloudGames.UsersApi
      Jwt__Audience: FiapCloudGames
      Jwt__SecretKey: ${JWT_SECRET:-development-only-secret-key-change-me-123456789}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      UsersApi__BaseUrl: http://users-api:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      users-api:
        condition: service_started
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - catalog-data:/data

  payments-api:
    build:
      context: ../FCG-PaymentsAPI
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      PaymentSimulation__ForcedStatus: Approved
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    volumes:
      - azurite-data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  loki:
    image: grafana/loki:3.2.0
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

volumes:
  loki-data:
  rabbitmq-data:
  users-data:
  catalog-data:
  mongodb-data:
  grafana-data:
  azurite-data:
