apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
spec:
  replicas: 1
  selector:
    matchLabels: {app: opensearch}
  template:
    metadata:
      labels: {app: opensearch}
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.3
          env:
            - {name: discovery.type, value: single-node}
            - {name: plugins.security.disabled, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: -Xms512m -Xmx512m}
          ports:
            - {containerPort: 9200}
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: opensearch-data}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  selector: {app: opensearch}
  ports:
    - {port: 9200, targetPort: 9200}
