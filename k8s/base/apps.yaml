apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-app-config
data:
  ASPNETCORE_URLS: http://+:8080
  Jwt__Issuer: FiapCloudGames.UsersApi
  Jwt__Audience: FiapCloudGames
  Database__Provider: Sqlite
  RabbitMq__Host: rabbitmq
  UsersApi__BaseUrl: http://users-api:8080
  MongoDb__Database: fcg_catalog
  Elasticsearch__IndexName: fcg-games
  PaymentSimulation__ForcedStatus: Approved
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: users-api}
  template:
    metadata:
      labels: {app: users-api}
    spec:
      containers:
        - name: users-api
          image: fcg-orchestration-users-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080}
          envFrom:
            - configMapRef: {name: fcg-app-config}
            - secretRef: {name: fcg-runtime}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
spec:
  type: ClusterIP
  selector: {app: users-api}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: catalog-api}
  template:
    metadata:
      labels: {app: catalog-api}
    spec:
      containers:
        - name: catalog-api
          image: fcg-orchestration-catalog-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080}
          envFrom:
            - configMapRef: {name: fcg-app-config}
            - secretRef: {name: fcg-runtime}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
spec:
  type: ClusterIP
  selector: {app: catalog-api}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api}
    spec:
      containers:
        - name: payments-api
          image: fcg-orchestration-payments-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080}
          envFrom:
            - configMapRef: {name: fcg-app-config}
            - secretRef: {name: fcg-runtime}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
spec:
  type: ClusterIP
  selector: {app: payments-api}
  ports:
    - {port: 8080, targetPort: 8080}
