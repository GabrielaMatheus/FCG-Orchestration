{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "prometheus"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "prometheus"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "prometheus"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "prometheus",
            "image": "prom/prometheus:v2.54.1",
            "ports": [
              {
                "containerPort": 9090
              }
            ],
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/prometheus"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "prometheus-config"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "prometheus"
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "prometheus"
    },
    "ports": [
      {
        "port": 9090,
        "targetPort": 9090
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "grafana"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "grafana"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "grafana"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "grafana",
            "image": "grafana/grafana:11.2.0",
            "ports": [
              {
                "containerPort": 3000
              }
            ],
            "volumeMounts": [
              {
                "name": "datasources",
                "mountPath": "/etc/grafana/provisioning/datasources"
              },
              {
                "name": "providers",
                "mountPath": "/etc/grafana/provisioning/dashboards"
              },
              {
                "name": "dashboards",
                "mountPath": "/var/lib/grafana/dashboards"
              }
            ],
            "env": [
              {
                "name": "GF_SECURITY_ADMIN_USER",
                "value": "admin"
              },
              {
                "name": "GF_SECURITY_ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "fcg-runtime",
                    "key": "GrafanaPassword"
                  }
                }
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "datasources",
            "configMap": {
              "name": "grafana-datasources"
            }
          },
          {
            "name": "providers",
            "configMap": {
              "name": "grafana-providers"
            }
          },
          {
            "name": "dashboards",
            "configMap": {
              "name": "grafana-dashboards"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "grafana"
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "grafana"
    },
    "ports": [
      {
        "port": 3000,
        "targetPort": 3000
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "loki"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "loki"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "loki"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "loki",
            "image": "grafana/loki:3.2.0",
            "ports": [
              {
                "containerPort": 3100
              }
            ],
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/loki"
              },
              {
                "name": "data",
                "mountPath": "/loki"
              }
            ],
            "args": [
              "-config.file=/etc/loki/loki.yml"
            ]
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "loki-config"
            }
          },
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "loki-data"
            }
          }
        ],
        "securityContext": {
          "fsGroup": 10001
        }
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "loki"
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "loki"
    },
    "ports": [
      {
        "port": 3100,
        "targetPort": 3100
      }
    ]
  }
}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
