apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fcg-key-vault
  namespace: fcg
spec:
  provider: azure
  secretObjects:
    - secretName: fcg-runtime
      type: Opaque
      data:
        - {objectName: jwt-secret-key, key: Jwt__SecretKey}
        - {objectName: rabbitmq-username, key: RabbitMq__Username}
        - {objectName: rabbitmq-password, key: RabbitMq__Password}
        - {objectName: admin-email, key: ADMIN_EMAIL}
        - {objectName: admin-password, key: ADMIN_PASSWORD}
        - {objectName: users-database, key: ConnectionStrings__UsersDatabase}
        - {objectName: catalog-database, key: ConnectionStrings__CatalogDatabase}
        - {objectName: mongodb-connection, key: ConnectionStrings__MongoDb}
        - {objectName: redis-connection, key: ConnectionStrings__Redis}
        - {objectName: elasticsearch-uri, key: Elasticsearch__Uri}
        - {objectName: elasticsearch-username, key: Elasticsearch__Username}
        - {objectName: elasticsearch-password, key: Elasticsearch__Password}
        - {objectName: grafana-password, key: GrafanaPassword}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__CSI_CLIENT_ID__"
    keyvaultName: "__KEY_VAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: rabbitmq-username
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: admin-email
          objectType: secret
        - |
          objectName: admin-password
          objectType: secret
        - |
          objectName: users-database
          objectType: secret
        - |
          objectName: catalog-database
          objectType: secret
        - |
          objectName: mongodb-connection
          objectType: secret
        - |
          objectName: redis-connection
          objectType: secret
        - |
          objectName: elasticsearch-uri
          objectType: secret
        - |
          objectName: elasticsearch-username
          objectType: secret
        - |
          objectName: elasticsearch-password
          objectType: secret
        - |
          objectName: grafana-password
          objectType: secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: key-vault-sync
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels: {app: key-vault-sync}
  template:
    metadata:
      labels: {app: key-vault-sync}
    spec:
      containers:
        - name: sync
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 20m, memory: 32Mi}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fcg-key-vault
