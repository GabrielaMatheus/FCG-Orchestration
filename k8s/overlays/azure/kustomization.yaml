apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fcg
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: fcg-app-config
    patch: |-
      - op: replace
        path: /data/Database__Provider
        value: Postgres
  - target:
      kind: Deployment
      name: users-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: catalog-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: kong
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy/type
        value: RollingUpdate
  - target:
      kind: Service
      name: kong
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
