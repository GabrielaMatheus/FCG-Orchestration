apiVersion: v1
kind: ConfigMap
metadata:
  name: fcg-app-config
data:
  ASPNETCORE_URLS: http://+:8080
  Jwt__Issuer: FiapCloudGames.UsersApi
  Jwt__Audience: FiapCloudGames
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: guest
  UsersApi__BaseUrl: http://users-api:8080
  MongoDb__Database: fcg_catalog
  ConnectionStrings__Redis: redis:6379
  PaymentSimulation__ForcedStatus: Approved
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: users-api}
  template:
    metadata:
      labels: {app: users-api}
    spec:
      containers:
        - name: users-api
          image: fcg-orchestration-users-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080}
          envFrom:
            - configMapRef: {name: fcg-app-config}
            - secretRef: {name: fcg-runtime}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: users-data}
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
spec:
  type: ClusterIP
  selector: {app: users-api}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
